<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — TechStore</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container" id="page-root"></div>

<div id="footer"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar();
  const root = document.getElementById('page-root');

  function renderEmpty() {
    root.innerHTML = `<div class="empty-state" style="margin:60px 0">${Icon.boxOpen}<p style="color:var(--ink-100);font-weight:600">Your cart is empty</p><a href="products.html" class="btn btn-primary" style="margin-top:16px">Browse products</a></div>`;
  }

  function renderForm() {
    const lines = cartLines();
    root.innerHTML = `
      <h1 style="font-size:30px;margin:36px 0 24px">Checkout</h1>
      <div class="two-col">
        <form id="checkout-form">
          <div style="display:flex;flex-direction:column;gap:14px">
            <input class="input" required placeholder="Full name" id="f-name" />
            <input class="input" required placeholder="Street address" id="f-address" />
            <div class="form-grid-2">
              <input class="input" required placeholder="City" id="f-city" />
              <input class="input" required placeholder="Country" id="f-country" />
            </div>
            <button type="submit" class="btn btn-primary btn-full">Place order — ${formatPrice(cartSubtotal())}</button>
          </div>
        </form>
        <div class="summary-card">
          <p class="mono" style="font-size:11px;text-transform:uppercase;color:var(--ink-500);margin-bottom:14px">Order summary</p>
          ${lines.map((l) => `<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px"><span style="color:var(--ink-300)">${l.product.name} × ${l.qty}</span><span class="mono">${formatPrice(l.product.price * l.qty)}</span></div>`).join('')}
          <div style="border-top:1px solid var(--graphite-700);margin-top:10px;padding-top:12px;display:flex;justify-content:space-between;font-weight:600">
            <span>Total</span><span class="mono" style="color:var(--brass-400)">${formatPrice(cartSubtotal())}</span>
          </div>
        </div>
      </div>`;

    document.getElementById('checkout-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const orderId = 'ORD' + Math.random().toString(36).slice(2, 10).toUpperCase();
      const order = {
        id: orderId,
        date: new Date().toISOString(),
        status: 'PENDING',
        total: cartSubtotal(),
        items: cartLines().map((l) => ({ name: l.product.name, slug: l.product.slug, qty: l.qty, price: l.product.price })),
      };
      const orders = JSON.parse(localStorage.getItem('techstore_orders') || '[]');
      orders.unshift(order);
      localStorage.setItem('techstore_orders', JSON.stringify(orders));
      localStorage.removeItem('techstore_cart');
      renderCartDrawer();
      updateCartBadge();
      renderSuccess(orderId);
    });
  }

  function renderSuccess(orderId) {
    root.innerHTML = `
      <div style="max-width:420px;margin:80px auto;text-align:center">
        <div style="color:var(--brass-500);margin-bottom:16px">${Icon.checkCircle}</div>
        <h1 style="font-size:24px">Order placed</h1>
        <p style="color:var(--ink-500);margin-top:8px">Order #${orderId} is confirmed. A summary is available in your dashboard.</p>
        <a href="account.html" class="btn btn-primary" style="margin-top:20px">View my orders</a>
      </div>`;
  }

  if (cartCount() === 0) renderEmpty(); else renderForm();
</script>
</body>
</html>
